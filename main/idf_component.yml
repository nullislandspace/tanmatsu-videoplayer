dependencies:
  idf: ">=5.5.1"
  badgeteam/badge-bsp: "^0.8.0"
  robotman2412/pax-gfx: "^2.0.6"
  # Capped below 2.6: from that version on, the component adds a CMake
  # chip-revision gate that hard-fails the build with "requires ESP32-P4
  # chip version >= 3.0". The Tanmatsu is rev v1.3. Without the cap the
  # component manager resolves the newest release and nothing builds.
  espressif/esp_audio_codec: ">=2.3.0,<2.6.0"
  # Pinned to 0.0.3: 0.1.0 removed the .concurrency_semaphore member from
  # es8156_config_t, which badge-bsp 0.8.0 still sets in
  # bsp_audio_initialize(). The BSP's own ">=0.0.2" would otherwise
  # resolve to 0.1.0 and break the build.
  nicolaielectronics/es8156: "==0.0.3"
